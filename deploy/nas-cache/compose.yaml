name: freshli4-site-cache

services:
  cache:
    # Reuse the immutable nginx image already installed on this NAS.
    image: docker.1ms.run/library/nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    pull_policy: never
    container_name: freshli4-site-cache
    user: "1001:1001"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 256m
    ports:
      - "127.0.0.1:8796:8080"
      - "192.168.0.2:10880:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cache:/var/cache/nginx
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1001,gid=1001,mode=1777
    networks: [gateway]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__cache_health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway:
    external: true
    name: gitea_default
