worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Do not log query strings, request bodies or authentication headers.
    log_format cache '$remote_addr $request_method $uri $status '
                     'cache=$upstream_cache_status time=$request_time';
    access_log /dev/stdout cache;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    sendfile on;
    keepalive_timeout 65;

    # Keep old fingerprinted assets when mutable pages are explicitly purged.
    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:8m
                     max_size=512m inactive=1d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets:16m
                     max_size=1536m inactive=30d use_temp_path=off;

    map "$request_method|$http_authorization|$http_cookie|$http_range|$http_x_vercel_protection_bypass" $skip_request_cache {
        default 1;
        "~^(GET|HEAD)\|\|\|\|$" 0;
    }
    map "$http_cache_control|$http_pragma" $client_cache_bypass {
        default 0;
        ~*(no-cache|no-store|max-age=0) 1;
    }
    map $upstream_http_cache_control $skip_response_cache {
        default 0;
        ~*(private|no-store|no-cache) 1;
    }

    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8081 default_server;
        server_name _;
        access_log off;
        return 444;
    }

    server {
        listen 8081;
        server_name www.freshli4.com cn-cache.freshli4.com;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8081;
        server_name freshli4.com;
        return 308 https://www.freshli4.com$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name _;
        access_log off;

        location = /__cache_health {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 444;
        }
    }

    server {
        listen 8080;
        server_name www.freshli4.com cn-cache.freshli4.com;

        # This Vercel DNS target stays independent of our geographic www record.
        set $vercel_origin 06a43d78bd7391ba.vercel-dns-017.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host www.freshli4.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name www.freshli4.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 75s;

        proxy_cache pages;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "www.freshli4.com|$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_bypass $skip_request_cache $client_cache_bypass;
        proxy_no_cache $skip_request_cache $client_cache_bypass $skip_response_cache;

        # Vercel's public static files request browser revalidation. Apply our
        # shared-cache TTL while still refusing private/no-store/no-cache or
        # Set-Cookie responses. Browser-facing headers remain untouched.
        proxy_ignore_headers Cache-Control Expires;
        add_header X-FreshLi4-Cache $upstream_cache_status always;

        location ~ "^/(api(?:/|$)|_vercel(?:/|$)|\.well-known(?:/|$))" {
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass https://$vercel_origin$request_uri;
            add_header X-FreshLi4-Cache BYPASS always;
        }

        location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9.]+$" {
            proxy_cache assets;
            proxy_cache_valid 200 30d;
            proxy_pass https://$vercel_origin$request_uri;
        }

        location / {
            proxy_pass https://$vercel_origin$request_uri;
        }
    }
}
